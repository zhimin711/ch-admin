apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: ch-admin
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: ch-admin
    spec:
      containers:
        - name: ch-admin-container
          image: 'registry.kubeoperator.io:8082/ch/ch-admin:${DATETIME}'
          ports:
            - name: tcp-80
              containerPort: 80
              protocol: TCP
      imagePullSecrets:
        - name: ch-nexus
