kind: Deployment
apiVersion: apps/v1
metadata:
  name: ch-admin
  namespace: ch
  labels:
    app: ch-admin
  annotations:
    kubesphere.io/creator: zhimin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ch-admin
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ch-admin
    spec:
      volumes:
        - name: volume-8gce8l
          configMap:
            name: ch-admin-configuration
            items:
              - key: default.conf
                path: default.conf
            defaultMode: 420
      containers:
        - name: container-jpfbhh
          image: 'hub.ch.cn/ch/ch-admin:${DATETIME}''
          ports:
            - name: tcp-80
              containerPort: 80
              protocol: TCP
          resources: {}
          volumeMounts:
            - name: volume-8gce8l
              readOnly: true
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      securityContext: {}
      imagePullSecrets:
        - name: ch-hub
      schedulerName: default-scheduler
